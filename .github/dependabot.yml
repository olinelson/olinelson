version: 2
updates:
- package-ecosystem: bun
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    bun:
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
      - "*"
